name: Build release assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify optional apt prerequisite prompts without real package installation
        run: |
          bash test_unit/offline_prerequisites_test.sh
          PREREQUISITE_SCRIPT=install-node.sh bash test_unit/offline_prerequisites_test.sh
      - name: Apply pinned Xray security dependency patch
        run: bash build/core/apply-security.sh
      - name: Verify optional TCP timeout does not abort TPROXY
        working-directory: third_party/Xray-core
        run: sudo env PATH="$PATH" go test ./transport/internet -run 'TestTCPUserTimeoutUnsupported|TestListenerExplicitTCP|TestListenerTPROXY|TestListenerRejects' -count=1
      - name: Verify Hysteria account validation and revocation
        working-directory: third_party/Xray-core
        run: go test -race ./transport/internet/hysteria ./proxy/hysteria/account -run "TestManagedEmpty|TestRevokedHysteria|TestDuplicateHysteria|TestHysteriaAuth" -count=1
      - name: Verify exact membership liveness and disconnect cleanup
        working-directory: third_party/Xray-core
        run: go test -race ./features/stats ./app/dispatcher ./app/stats ./app/stats/command -count=1
      - name: Verify client online identity, expiry tooltips and quota ordering
        run: |
          go test ./web/service ./web/job ./xray -run 'TestMembershipOnline|TestMtprotoMetrics|TestAppendUnrecorded|TestWireguardHandshake|TestCoreTraffic|TestAccountSort|TestOverview' -count=1
          go test -race ./xray ./web/job ./web/service -run 'TestMembershipTraffic|TestCoreTrafficExactSources|TestAppendUnrecorded' -count=1
          go test ./web/service -run 'TestClientStatsForSeparatesSharedPool|TestAttachClientStats|TestAddClientTraffic|TestMigrationMembershipUsage|TestRepairMembershipUsage' -count=1
          node test_unit/client_online_info_test.cjs
          node test_unit/client_details_2fa_test.cjs
          node test_unit/export_test/export.test.js
          node test_unit/inbound_speed_units_test.cjs
          go test ./web -run 'TestRepresentativeOverview|TestAdministratorSidebar' -count=1
      - name: Verify authentication, sessions, origins and private backups
        run: go test -race ./database ./web/session ./web/middleware ./web/controller ./web/service -run '^TestSecurity' -count=1
      - name: Verify repeated native restores, migrated accounts and rollback
        run: go test -race ./web/service ./web/controller -run '^TestRestore' -count=1
      - name: Verify six audit fixes and allowed certificate, SSH, overview and backup access
        run: go test -race ./web/controller ./web/service ./web/session -run 'TestSecurityAudit' -count=1
      - name: Verify explicit representative Overview grants, live revocation and concurrent logs
        run: go test -race ./logger ./web/controller -run 'TestConcurrentLogBuffer|TestRepresentativeOverview|TestSecurityAuditWebsocket|TestInboundSpeedUnits' -count=1
      - name: Verify complete delegated panel settings and owner-account isolation
        run: go test -race ./web/controller -run 'TestDelegatedPanelSettings|TestSecurityNonOwnerCannotReplaceDatabaseAuthenticationOrExecutable|TestSecurityOtherSuperCannotEditProtectedOwnerOrAssignedRole' -count=1
      - name: Verify administrator, representative and node access boundaries
        run: go test ./web/controller ./web/service ./web ./nodeagent -run 'TestCrossAdminIsolation|TestResellerIsolation|TestRepresentativeInbound|TestRepresentativeBoundaryPreservesAdministratorAccess|TestRepresentativeUpdate|TestRepresentativeClientRead|TestPasarGuardReadAllDoesNotWidenOwnWrite|TestPasarGuardMissingResetPermission|TestNodeAgentHTTPAuthenticationAndScope|TestNodeAdministrationRejectsRepresentative|TestNodeManagement|TestRepresentativeRoleWritesDeny|TestRepresentativeOverview|TestMigratedGlobalTwoFactorSecretIsNotServed' -count=1
      - name: Verify bounded QUIC trailer decoding
        working-directory: third_party/quic-go
        run: go test ./http3 -run TestResponseTrailer -count=1
      - name: Scan panel and embedded Xray dependencies
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./web/... ./nodeagent/...
          cd third_party/Xray-core
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./main/...
      - name: Build patched Xray and complete geodata
        run: GEO_LEAN=0 bash build/core/build.sh ${{ matrix.arch }}
      - name: Verify exact account usage over concurrent VMess and Shadowsocks TCP and UDP
        run: RUN_CORE_TRAFFIC_INTEGRATION=1 XRAY_TRAFFIC_BINARY="$PWD/corebundle/core/${{ matrix.arch }}/xray" go test -race ./web/service -run '^TestCoreTrafficRealConcurrentProtocols$' -count=1 -timeout 90s
      - name: Verify all six bundled geodata files
        run: |
          for file in geoip.dat geosite.dat geoip_IR.dat geosite_IR.dat geoip_RU.dat geosite_RU.dat; do
            test -s "corebundle/core/$file"
            test "$(stat -c %s "corebundle/core/$file")" -gt 1048576
          done
      - name: Cache portable VPN backends
        id: backend-cache
        uses: actions/cache@v4
        with:
          path: backend/bin/${{ matrix.arch }}
          key: backend-${{ matrix.arch }}-${{ hashFiles('build/backend/**', '.gitmodules') }}-v1
      - name: Build all portable VPN backends
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: bash build/backend/build.sh ${{ matrix.arch }}
      - name: Verify IP admission, eviction, reload and concurrent connection safety
        working-directory: third_party/Xray-core
        run: go test -race ./common/speedlimit -count=1
      - name: Verify speed policies, reset admission and central node period usage
        run: go test -race ./web/service ./web/controller ./nodeagent -run 'TestReset|TestSpeed|TestCompute|TestNodeSpeedThreshold|TestConfigChange|TestIndependent|TestIsRestartDue' -count=1
      - name: Build panel
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -tags netgo,osusergo -trimpath -ldflags='-s -w -linkmode external -extldflags "-static"' -o dist/vpn-ui-${{ matrix.arch }} .
          test "$(dist/vpn-ui-${{ matrix.arch }} -v)" = "1.0.0"
          CGO_ENABLED=1 go build -tags netgo,osusergo -trimpath -ldflags='-s -w -linkmode external -extldflags "-static"' -o dist/vpn-ui-node-${{ matrix.arch }} ./cmd/vpn-ui-node
          test "$(dist/vpn-ui-node-${{ matrix.arch }} -v)" = "1.0.0"
          file dist/vpn-ui-${{ matrix.arch }} dist/vpn-ui-node-${{ matrix.arch }}
          go test ./corebundle -run TestExtractXray -count=1
      - name: Verify dedicated node authentication, billing, subscriptions and real data plane
        run: |
          go test -race ./nodeagent ./web/service -run 'TestNodeProvision|TestNodeTag|TestNodeDuplicateIncoming|TestNodeSnapshotHistory|TestNodeLegacyZero|TestNodeReportConflict' -count=1
          go test ./nodeagent ./web/service ./web/controller ./sub -run 'TestNode' -count=1
          RUN_NODE_INTEGRATION=1 go test ./nodeagent -run '^TestNodeRealDataPlane$' -count=1 -timeout 420s
      - name: Verify node page creation, runtime controls and shared graphical/file editors in Chromium (all thirteen languages)
        run: |
          npm install --prefix /tmp/vpn-ui-browser-tests playwright@1.62.1 --no-audit --no-fund
          /tmp/vpn-ui-browser-tests/node_modules/.bin/playwright install --with-deps chromium
          export NODE_PATH=/tmp/vpn-ui-browser-tests/node_modules
          export NODE_UI_CHROME=$(node -e 'console.log(require("playwright").chromium.executablePath())')
          node test_unit/client_details_browser_test.cjs
          node test_unit/account_usage_breakdown_browser_test.cjs
          RUN_NODE_UI_BROWSER=1 go test ./web/middleware -run '^TestSecurityBrowserPanelNavigationRuntime$' -count=1 -timeout 60s
          RUN_NODE_UI_BROWSER=1 go test ./web -run '^Test(NodePageBrowserRuntime|OverviewSSLBrowserRuntime|RepresentativeOverviewHidesInboundManagementAndUpdates|AdminRolesBrowserRuntime|DelegatedSettingsBrowserRuntime|RepresentativeEditBrowserRuntime|GroupsBrowserRuntime)$' -count=1 -timeout 600s
      - name: Verify ownership transfer and online counts
        run: go test -tags netgo,osusergo ./web/service ./web/controller -run 'TestSaveAccount|TestLeavingAnAccount|TestIndependentAccount|TestMembershipEnable|TestDisabledMembership|TestRemovingTheLastMembership|TestToggleClientEnableByEmail|TestRenameAccount|TestSortAccountRows|TestAccountSort|TestClientLimit|TestResolveUserLimitOverride|TestAllocateBlockIP|TestOldestBlockSession|TestAdmit|TestSpeedLimit|TestAdminRoles|TestAdminOwner|TestAccountOwnershipTransfer|TestPasarGuard|TestOverview|TestVerifiedProvisioned|TestOffline|TestMigrationAccountsVerifiesExistingImported'
      - name: Verify imported subscription quotas and legacy credentials
        run: go test ./sub ./compat/pasarguard -run 'TestPasarGuard|TestGetSubs|TestExistingSubscriptionFormats|TestInvalidTokens|TestDisplayToken|TestHysteria' -count=1
      - name: Verify offline refresh guard
        run: |
          go test ./web/job -run 'TestOffline' -count=1
          go test ./web/service -run 'TestSSL|TestOverviewRequiredCores|TestOverviewCentralXrayTags' -count=1
      - name: Verify representative role management
        run: go test ./web/service ./web/controller ./web -run 'TestRepresentativeRole|TestRepresentativeEdit|TestGroups' -count=1
      - name: Verify complete translation catalogs, component locales and Telegram language reload
        run: |
          go test ./web -run 'TestPersianInboundFormsRender|TestAllTemplatesParse|TestEditedTemplatesParse|TestTranslationsAreValidToml|TestTranslationKeyParity|TestAllLocaleMessagesRenderAndPreserveVariables|TestComponentLocaleCoverage'
          go test -race ./web/locale ./web/service -run 'TestEnglishFallback|TestPersianBot|TestBotLocaleReload|TestTelegram' -count=1
      - name: Verify actual TCP and UDP socket lifetimes
        run: |
          go test ./util/sys ./web/service -run 'TestSocketCounts|TestConnection' -count=1
          node test_unit/hysteria_link_test.cjs
          node test_unit/client_edit_regression_test.cjs
          node test_unit/inbound_stats_test.js
          node test_unit/overview_ssl_stats_test.cjs
          node --check web/assets/js/model/inbound.js
          node --check web/assets/js/model/outbound.js
      - name: Package migration and checksums
        run: |
          mkdir -p dist/migration
          cp migration/migrate.sh migration/convert.py migration/preflight.py migration/INSTALL-MIGRATION.fa.md migration/install.sh migration/config.json migration/diagnose.py migration/repair.py migration/repair.sh dist/migration/
          test ! -e dist/migration/vpn-ui-custom
          test ! -e dist/migration/pasarguard-db
          cd dist/migration
          zip -q ../vpn-ui-auto-migration.zip *
          cd ..
          cp ../install-offline.sh ../install-node.sh .
          bash -n install-offline.sh install-node.sh
          sha256sum vpn-ui-${{ matrix.arch }} vpn-ui-node-${{ matrix.arch }} vpn-ui-auto-migration.zip install-offline.sh install-node.sh > SHA256SUMS
      - name: Verify node uninstall cancellation, guards and real systemd cleanup
        run: |
          bash test_unit/node_uninstall_test.sh
          go test -race ./nodeagent ./web/service -run 'TestNodeUninstall|TestNodeCleanup|TestUnknownProvenance' -count=1
          sudo bash test_unit/node_uninstall_systemd_test.sh "$PWD/dist/vpn-ui-node-${{ matrix.arch }}"
      - name: Verify fresh installation and update without installer network access
        run: |
          sudo unshare --net bash install-offline.sh --lang en "$PWD/dist/vpn-ui-${{ matrix.arch }}" > /tmp/offline-install.log 2>&1
          sudo systemctl is-active --quiet vpn-ui
          USER_BEFORE=$(sudo env VPNUI_OFFLINE=1 /opt/vpn-ui/vpn-ui-amd64 info --get username)
          PORT_BEFORE=$(sudo env VPNUI_OFFLINE=1 /opt/vpn-ui/vpn-ui-amd64 info --get port)
          WEB_PATH=$(sudo env VPNUI_OFFLINE=1 /opt/vpn-ui/vpn-ui-amd64 info --get webBasePath)
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT_BEFORE$WEB_PATH" -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT_BEFORE$WEB_PATH" -o /dev/null
          sudo unshare --net bash install-offline.sh --lang en "$PWD/dist/vpn-ui-${{ matrix.arch }}" > /tmp/offline-update.log 2>&1
          test "$USER_BEFORE" = "$(sudo env VPNUI_OFFLINE=1 /opt/vpn-ui/vpn-ui-amd64 info --get username)"
          test "$PORT_BEFORE" = "$(sudo env VPNUI_OFFLINE=1 /opt/vpn-ui/vpn-ui-amd64 info --get port)"
          sudo systemctl is-active --quiet vpn-ui
          mkdir -p /tmp/offline-rollback-test
          printf '#!/usr/bin/env bash\nif [[ ${1:-} == -v ]]; then echo 1.0.0; exit 0; fi\nexit 19\n' > /tmp/offline-rollback-test/vpn-ui-amd64
          chmod +x /tmp/offline-rollback-test/vpn-ui-amd64
          BINARY_BEFORE=$(sudo sha256sum /opt/vpn-ui/vpn-ui-amd64 | cut -d ' ' -f 1)
          if sudo unshare --net bash install-offline.sh --lang en /tmp/offline-rollback-test/vpn-ui-amd64 > /tmp/offline-rollback.log 2>&1; then
            echo "Fault injection unexpectedly succeeded"; exit 1
          fi
          test "$BINARY_BEFORE" = "$(sudo sha256sum /opt/vpn-ui/vpn-ui-amd64 | cut -d ' ' -f 1)"
          test "$USER_BEFORE" = "$(sudo env VPNUI_OFFLINE=1 /opt/vpn-ui/vpn-ui-amd64 info --get username)"
          test "$PORT_BEFORE" = "$(sudo env VPNUI_OFFLINE=1 /opt/vpn-ui/vpn-ui-amd64 info --get port)"
          sudo systemctl is-active --quiet vpn-ui
          sudo systemctl stop vpn-ui
      - name: Diagnose offline installation failures
        if: failure()
        run: |
          for logfile in /tmp/offline-install.log /tmp/offline-update.log /tmp/offline-rollback.log; do
            if test -f "$logfile"; then sudo tail -50 "$logfile" | sed -E 's/(Password:).*/\1 [redacted]/'; fi
          done
          sudo journalctl -u vpn-ui -n 60 --no-pager || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          retention-days: 2
  publish:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish both architectures with combined checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum vpn-ui-amd64 vpn-ui-arm64 vpn-ui-node-amd64 vpn-ui-node-arm64 vpn-ui-auto-migration.zip install-offline.sh install-node.sh > SHA256SUMS
          gh release upload v1.0.0 vpn-ui-amd64 vpn-ui-arm64 vpn-ui-node-amd64 vpn-ui-node-arm64 vpn-ui-auto-migration.zip install-offline.sh install-node.sh SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
