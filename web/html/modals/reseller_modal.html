{{define "modals/resellerModal"}}
<a-modal id="reseller-modal" v-model="resellerModal.visible" :title="resellerModal.title" @ok="resellerModal.ok"
  :confirm-loading="resellerModal.confirmLoading" :closable="!resellerModal.confirmLoading" :mask-closable="false"
  :cancel-button-props="{ props: { disabled: resellerModal.confirmLoading } }"
  :ok-text="resellerModal.okText" cancel-text='{{ i18n "close" }}' :class="themeSwitcher.currentTheme">
  <!-- label-col is 10, not 8: at 8 the longest labels ("Minimum Account (GB)",
       "{{ i18n "pages.interfaceExtra.minimumTopUpGB" }}") are wider than the box and lose
       their trailing characters and tooltip icon, since a form-item label does not
       wrap. 10 covers the widest of them and takes the width from the gap between
       the columns, so the controls keep the size they already had. -->
  <a-form :colon="false" :label-col="{ md: { span: 10 } }" :wrapper-col="{ md: { span: 14 } }">

    <a-alert v-if="resellerModal.error" type="error" show-icon :message="resellerModal.error"
      :style="{ marginBottom: '16px' }"></a-alert>

    <a-form-item label='{{ i18n "pages.resellers.username" }}'>
      <a-input v-model.trim="resellerModal.reseller.username"></a-input>
    </a-form-item>

    <a-form-item>
      <template slot="label">
        <a-tooltip v-if="resellerModal.isEdit">
          <template slot="title">{{ i18n "pages.resellers.passwordUnchangedHint" }}</template>
          {{ i18n "pages.resellers.password" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
        <span v-else>{{ i18n "pages.resellers.password" }}</span>
      </template>
      <a-input-password v-model="resellerModal.reseller.password"
        :placeholder="resellerModal.isEdit ? '{{ i18n "pages.resellers.passwordUnchangedHint" }}' : ''"></a-input-password>
    </a-form-item>

    <a-form-item label='{{ i18n "pages.resellers.nickname" }}'>
      <a-input v-model.trim="resellerModal.reseller.nickname"></a-input>
    </a-form-item>

    <a-form-item label='{{ i18n "pages.resellers.role" }}'>
      <a-select v-model="resellerModal.reseller.representativeRoleId" :loading="resellerModal.rolesLoading"
        @change="resellerModal.onRoleChange()"
        :disabled="resellerModal.rolesLoading || (resellerModal.isEdit && {{not .perms.superAdmin}})" placeholder='{{ i18n "pages.roles.select" }}'>
 <template slot="notFoundContent">{{ i18n "pages.roles.empty" }}</template>
        <a-select-option v-for="role in resellerModal.roles" :key="role.id" :value="role.id">[[ role.name ]]</a-select-option>
      </a-select>
      {{if .perms.superAdmin}}<a-button size="small" @click="pgRole.show(null)">{{ i18n "pages.roles.add" }}</a-button>
      <a-button size="small" :disabled="!resellerModal.roles.some(r => r.id === resellerModal.reseller.representativeRoleId)" @click="pgRole.show(resellerModal.roles.find(r => r.id === resellerModal.reseller.representativeRoleId))">{{ i18n "edit" }}</a-button>{{end}}
    </a-form-item>
    <a-form-item label='{{ i18n "pages.resellers.enable" }}'>
      <a-switch v-model="resellerModal.reseller.enable"></a-switch>
    </a-form-item>

    <a-form-item label='{{ i18n "pages.accountSecurity.requireTwoFactor" }}'>
      <a-switch v-model="resellerModal.reseller.twoFactorRequired"></a-switch>
      <p class="bo-muted">{{ i18n "pages.accountSecurity.requireDesc" }}</p>
    </a-form-item>

    <!-- Off by default: the overview reports the whole server (every inbound, total
         traffic, system load), none of which is the reseller's to see. Granted only
         where the reseller is trusted with that view. -->
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">{{ i18n "pages.resellers.allowOverviewDesc" }}</template>
          {{ i18n "pages.resellers.allowOverview" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-switch v-model="resellerModal.reseller.allowOverview"
        @change="resellerModal.onAllowOverviewChange"></a-switch>
    </a-form-item>

    <!-- Scopes the page above rather than a page of its own: with the overview
         withheld there is nothing here to manage, so the switch is dead until it
         is granted. The server reads it the same way and ignores this flag on its
         own. -->
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">{{ i18n "pages.resellers.allowOverviewManageDesc" }}</template>
          {{ i18n "pages.resellers.allowOverviewManage" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-switch v-model="resellerModal.reseller.allowOverviewManage"
        :disabled="!resellerModal.reseller.allowOverview"></a-switch>
    </a-form-item>

    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">{{ i18n "pages.resellers.unlimitedDesc" }}</template>
          {{ i18n "pages.resellers.unlimited" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-switch v-model="resellerModal.reseller.unlimited"></a-switch>
    </a-form-item>

    <!-- The balance is settable ONCE, at creation. On edit it is shown but not editable,
         and Recharge (a delta) is the only way to move it: an admin typing over the total
         would silently rewrite the history every outstanding account was sold out of, and
         depending on which way they typed would either hand the reseller free traffic or
         strand accounts that are already live and already paid for. A delta cannot do that.
         Hidden entirely while unlimited is on, where a total means nothing. -->
    <a-form-item v-if="!resellerModal.reseller.unlimited">
      <template slot="label">
        <a-tooltip>
          <template slot="title">{{ i18n "pages.resellers.totalTrafficDesc" }}</template>
          {{ i18n "pages.resellers.totalTraffic" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-input-number v-model.number="resellerModal.reseller.allowanceGb" :min="0"
        :style="{ width: '100%' }"></a-input-number>
      <div v-if="resellerModal.isEdit" :style="{ fontSize: '12px', color: '#8c8c8c' }">
        {{ i18n "pages.resellers.rechargeDesc" }}
      </div>
    </a-form-item>




    <!-- Group grants are authoritative; their inbound union updates dynamically. -->
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">{{ i18n "pages.groups.representativeHint" }}</template>
          {{ i18n "pages.groups.title" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-alert v-if="!resellerModal.availableGroups.length" type="info" show-icon
        message='{{ i18n "pages.groups.noGroups" }}'></a-alert>
      <template v-else>
        <a-checkbox :checked="resellerModal.allChecked" :indeterminate="resellerModal.someChecked"
          :disabled="resellerModal.rolesLoading" @change="resellerModal.toggleAll">
          <span :style="{ fontWeight: 500 }">{{ i18n "pages.resellers.selectAllInbounds" }}</span>
        </a-checkbox>
        <a-divider :style="{ margin: '8px 0' }"></a-divider>
        <div :style="{ maxHeight: '180px', overflowY: 'auto' }">
          <a-checkbox-group v-model="resellerModal.reseller.groupIds" :disabled="resellerModal.rolesLoading" :style="{ width: '100%' }">
            <a-row>
              <a-col :span="24" v-for="ib in resellerModal.availableGroups" :key="ib.id">
                <a-checkbox :value="ib.id">
                  [[ ib.name ]]
                </a-checkbox>
              </a-col>
            </a-row>
          </a-checkbox-group>
        </div>
      </template>
    </a-form-item>
  </a-form>
</a-modal>

<script>
  const ONE_GB_BYTES = 1024 * 1024 * 1024;

  const resellerModal = {
    title: '',
    visible: false,
    confirmLoading: false,
    error: '',
    okText: '{{ i18n "sure" }}',
    isEdit: false,
    confirm: null,
    allGroups: [],
    roles: [], rolesLoading: false,
    async loadRoles() {
      this.rolesLoading = true;
      try {
        const msg = await HttpUtil.get('/panel/resellers/roles');
        if (msg && msg.success) {
          this.roles = msg.obj || [];
          if (!this.isEdit && !this.roles.some(r => r.id === this.reseller.representativeRoleId)) {
            this.reseller.representativeRoleId = this.roles.length === 1 ? this.roles[0].id : undefined;
            this.onRoleChange();
          }
        }
      } finally { this.rolesLoading = false; }
    },
    reseller: {
      id: 0, username: '', password: '', nickname: '', enable: true, representativeRoleId: undefined,
      unlimited: false, allowanceGb: 0, daysPerGb: 0, minCreateGb: 0, minAddGb: 0,
      allowOverview: false, allowOverviewManage: false, twoFactorRequired: false,
      groupIds: [],
    },

    onRoleChange() {
      const role = this.roles.find(r => r.id === this.reseller.representativeRoleId);
      if (!role) { this.reseller.groupIds = []; return; }
      let access;
      try { access = JSON.parse(role.access || '{}') || {}; }
      catch (_) { this.reseller.groupIds = []; return; }
      const allowed = access.allowed_group_ids;
      this.reseller.groupIds = this.allGroups
        .filter(g => !Array.isArray(allowed) || allowed.includes(g.id))
        .map(g => g.id);
    },

    get availableGroups() {
      const role = this.roles.find(r => r.id === this.reseller.representativeRoleId);
      let access = {}; try { access = role && JSON.parse(role.access || '{}') || {}; } catch (_) {}
      const allowed = access.allowed_group_ids;
      return this.allGroups.filter(g => !Array.isArray(allowed) || allowed.includes(g.id) || (this.reseller.groupIds || []).includes(g.id));
    },
    get allChecked() {
      const picked = resellerModal.reseller.groupIds || [];
      return resellerModal.availableGroups.length > 0 &&
        resellerModal.availableGroups.every(g => picked.includes(g.id));
    },
    get someChecked() {
      const n = (resellerModal.reseller.groupIds || []).length;
      return n > 0 && n < resellerModal.availableGroups.length;
    },
    toggleAll(e) {
      resellerModal.reseller.groupIds = e.target.checked
        ? resellerModal.availableGroups.map(ib => ib.id)
        : [];
    },
    // Taking the overview away takes the management grant with it. Leaving a true
    // parked behind the disabled switch would save a grant nobody can see, and
    // re-granting the page later would hand back its controls with it.
    onAllowOverviewChange(checked) {
      if (!checked) resellerModal.reseller.allowOverviewManage = false;
    },
    async ok() {
      if (resellerModal.confirmLoading) return;
      resellerModal.confirmLoading = true;
      resellerModal.error = '';
      try {
        const msg = await resellerModal.confirm(resellerModal.reseller);
        if (!msg || !msg.success) resellerModal.error = (msg && msg.msg) || '{{ i18n "somethingWentWrong" }}';
      } catch (error) {
        resellerModal.error = error.message || '{{ i18n "somethingWentWrong" }}';
      } finally {
        resellerModal.confirmLoading = false;
      }
    },
    async show({ title = '', okText = '{{ i18n "sure" }}', reseller = null, allGroups = [], confirm = () => { }, isEdit = false }) {
      this.title = title;
      this.okText = okText;
      this.confirm = confirm;
      this.error = '';
      this.isEdit = isEdit;
      this.allGroups = allGroups || [];
      if (isEdit && reseller) {
        this.reseller = {
          id: reseller.id,
          representativeRoleId: reseller.representativeRoleId,
        username: reseller.username,
          password: '', // blank means "keep the current one"
          nickname: reseller.nickname || '',
          enable: !!reseller.enable,
          twoFactorRequired: !!reseller.twoFactorRequired,
          unlimited: !!reseller.unlimited,
          // Every balance movement is a whole number of GB (create, recharge), so the
          // round is exact and only exists to keep a float out of the form.
          allowanceGb: Math.round((Number(reseller.allowanceBytes) || 0) / ONE_GB_BYTES),
          daysPerGb: Number(reseller.daysPerGb) || 0,
          minCreateGb: Number(reseller.minCreateGb) || 0,
          minAddGb: Number(reseller.minAddGb) || 0,
          allowOverview: !!reseller.allowOverview,
          allowOverviewManage: !!reseller.allowOverviewManage,
          groupIds: (reseller.groupIds || []).slice(),
        };
      } else {
        this.reseller = {
          id: 0, username: '', password: '', nickname: '', enable: true, representativeRoleId: undefined,
          unlimited: false, allowanceGb: 0, daysPerGb: 0, minCreateGb: 0, minAddGb: 0,
          allowOverview: false, allowOverviewManage: false, twoFactorRequired: false,
          groupIds: [],
        };
      }
      this.visible = true;
      this.rolesLoading = true;
      try {
        const groups = await HttpUtil.get('/panel/resellers/groups');
        if (groups && groups.success) this.allGroups = groups.obj || [];
        await this.loadRoles();
        if (!this.isEdit) this.onRoleChange();
      } finally { this.rolesLoading = false; }
    },
    // Bodies are form-urlencoded (a global axios interceptor Qs.stringify's them), and Qs
    // emits an array as repeated keys, which is what Gin binds into []string. Numbers are
    // coerced here because a cleared a-input-number yields undefined, which posts as an
    // empty value and fails int binding server-side.
    toPayload(reseller) {
      return {
        representativeRoleId: reseller.representativeRoleId,
        username: reseller.username,
        password: reseller.password,
        nickname: reseller.nickname,
        enable: reseller.enable,
        twoFactorRequired: !!reseller.twoFactorRequired,
        unlimited: reseller.unlimited,
        // On edit this is the unchanged current balance: the field is disabled, so posting
        // it back is a no-op whichever way the server reads it. Recharge moves the balance.
        allowanceGb: Number(reseller.allowanceGb) || 0,
        daysPerGb: Number(reseller.daysPerGb) || 0,
        minCreateGb: Number(reseller.minCreateGb) || 0,
        minAddGb: Number(reseller.minAddGb) || 0,
        allowOverview: reseller.allowOverview,
        allowOverviewManage: reseller.allowOverviewManage,
        // A blank entry is how "none" is sent: an omitted key binds as nil server-side and
        // cannot be told apart from "leave the existing grants alone".
        groupIds: (reseller.groupIds || []).length ? reseller.groupIds : [''],
      };
    },
    close() {
      resellerModal.visible = false;
      resellerModal.loading(false);
    },
    loading(loading = true) {
      resellerModal.confirmLoading = loading;
    },
  };

  new Vue({
    delimiters: ['[[', ']]'],
    el: '#reseller-modal',
    data: { resellerModal: resellerModal, pgRole: pgRole },
  });
</script>
{{end}}
