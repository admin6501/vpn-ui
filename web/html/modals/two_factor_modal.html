{{define "modals/twoFactorModal"}}
<a-modal id="two-factor-modal" v-model="twoFactorModal.visible" :title="twoFactorModal.title" :closable="!twoFactorModal.submitting" :mask-closable="!twoFactorModal.submitting"
    :class="themeSwitcher.currentTheme">
    <template v-if="twoFactorModal.type === 'set'">
        <label>{{ i18n "pages.settings.currentPassword" }}</label>
        <a-input-password autocomplete="current-password" v-model="twoFactorModal.enteredPassword"></a-input-password>
        <p>{{ i18n "pages.settings.security.twoFactorModalSteps" }}</p>
        <a-divider></a-divider>
        <p>{{ i18n "pages.settings.security.twoFactorModalFirstStep" }}</p>
        <div :style="{ display: 'flex', alignItems: 'center', flexDirection: 'column', gap: '12px' }">
            <div class="qr-bg" :style="{ width: '180px', height: '180px' }">
                <canvas @click="copy(twoFactorModal.token)" id="twofactor-qrcode" class="qr-cv"></canvas>
            </div>
            <span :style="{ fontSize: '12px', fontFamily: 'monospace' }">[[ twoFactorModal.token ]]</span>
        </div>
        <a-divider></a-divider>
        <p>{{ i18n "pages.settings.security.twoFactorModalSecondStep" }}</p>
        <a-input autocomplete="one-time-code" inputmode="numeric" v-model.trim="twoFactorModal.enteredCode" :style="{ width: '100%' }"></a-input>
    </template>
    <template v-if="twoFactorModal.type === 'confirm'">
        <p>[[ twoFactorModal.description ]]</p>
        <a-input autocomplete="one-time-code" inputmode="numeric" v-model.trim="twoFactorModal.enteredCode" :style="{ width: '100%' }"></a-input>
    </template>
    <template slot="footer">
        <a-button :disabled="twoFactorModal.submitting" @click="twoFactorModal.cancel">
            <span>{{ i18n "cancel" }}</span>
        </a-button>
        <a-button type="primary" :loading="twoFactorModal.submitting" :disabled="twoFactorModal.enteredCode.length < 6" @click="twoFactorModal.ok">
            <span>{{ i18n "confirm" }}</span>
        </a-button>
    </template>
</a-modal>

<script>
    const twoFactorModal = {
        enteredPassword: "",
        title: '',
        description: '',
        fileName: '',
        token: '',
        enteredCode: '',
        visible: false,
        type: 'set',
        confirm: null,
        totpObject: null,
        qrImage: "",
        submitting: false,
        async ok() {
            if (twoFactorModal.submitting) return;
            twoFactorModal.submitting = true;
            // Snapshot credentials before an async callback; the server validates
            // the code with its clock and permitted adjacent time windows.
            const code = twoFactorModal.enteredCode;
            const password = twoFactorModal.enteredPassword;
            try {
                const saved = await twoFactorModal.confirm(true, code, password);
                if (saved !== false) twoFactorModal.close();
            } finally {
                twoFactorModal.submitting = false;
            }
        },
        cancel() {
            if (twoFactorModal.submitting) return;
            ObjectUtil.execute(twoFactorModal.confirm, false)

            twoFactorModal.close()
        },
        show: function ({
            title = '',
            description = '',
            token = '',
            type = 'set',
            confirm = (success) => { }
        }) {
            this.enteredCode = "";
            this.enteredPassword = "";
            this.title = title;
            this.description = description;
            this.token = token;
            this.visible = true;
            this.confirm = confirm;
            this.type = type;

            // Only enrolment has a secret to build a TOTP from; OTPAuth throws on an
            // empty one.
            this.totpObject = token
                ? new OTPAuth.TOTP({
                    issuer: "VPN-UI",
                    label: "Administrator",
                    algorithm: "SHA1",
                    digits: 6,
                    period: 30,
                    secret: token,
                })
                : null;
        },
        close: function () {
            twoFactorModal.enteredPassword = "";
            twoFactorModal.enteredCode = "";
            twoFactorModal.visible = false;
        },
    };

    const twoFactorModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#two-factor-modal',
        data: {
            twoFactorModal: twoFactorModal,
        },
        updated() {
          if (
            this.twoFactorModal.visible &&
            this.twoFactorModal.type === 'set' &&
            this.twoFactorModal.totpObject &&
            document.getElementById('twofactor-qrcode')
          ) {
            this.setQrCode('twofactor-qrcode', this.twoFactorModal.totpObject.toString());
          }
        },
        methods: {
          setQrCode(elementId, content) {
            new QRious({
              element: document.getElementById(elementId),
              size: 200,
              value: content,
              background: 'white',
              backgroundAlpha: 0,
              foreground: 'black',
              padding: 2,
              level: 'L'
            });
          },
          copy(content) {
            ClipboardManager
              .copyText(content)
              .then(() => {
                app.$message.success('{{ i18n "copied" }}')
              })
          },
        }
    });
</script>
{{end}}
