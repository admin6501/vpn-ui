{{define "modals/adminModal"}}
<a-modal id="admin-modal" v-model="adminModal.visible" :title="adminModal.title" @ok="adminModal.ok"
  :confirm-loading="adminModal.confirmLoading" :closable="true" :mask-closable="false"
  :ok-text="adminModal.okText" cancel-text='{{ i18n "close" }}' :class="themeSwitcher.currentTheme">
  <a-form :colon="false" :label-col="{ md: { span: 8 } }" :wrapper-col="{ md: { span: 14 } }">

    <a-form-item label='{{ i18n "pages.admins.username" }}'>
      <a-input v-model.trim="adminModal.admin.username" :disabled="adminModal.admin.isSuperAdmin && adminModal.isSelf"></a-input>
    </a-form-item>

    <a-form-item>
      <template slot="label">
        <a-tooltip v-if="adminModal.isEdit">
          <template slot="title">{{ i18n "pages.admins.passwordUnchangedHint" }}</template>
          {{ i18n "pages.admins.password" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
        <span v-else>{{ i18n "pages.admins.password" }}</span>
      </template>
      <a-input-password v-model="adminModal.admin.password"
        :placeholder="adminModal.isEdit ? '{{ i18n "pages.admins.passwordUnchangedHint" }}' : ''"></a-input-password>
    </a-form-item>

    <a-form-item label='{{ i18n "pages.admins.nickname" }}'>
      <a-input v-model.trim="adminModal.admin.nickname"></a-input>
    </a-form-item>

    <a-form-item label='{{ i18n "enable" }}'>
      <a-switch v-model="adminModal.admin.enable" :disabled="adminModal.isSelf || adminModal.admin.isPanelOwner"></a-switch>
    </a-form-item>

    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">{{ i18n "pages.admins.superAdminDesc" }}</template>
          {{ i18n "pages.admins.superAdmin" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-switch v-model="adminModal.admin.isSuperAdmin" :disabled="adminModal.isEdit && adminModal.admin.isSuperAdmin && !adminModal.canDemote" @change="adminModal.superChanged($event)"></a-switch>
      <p v-if="adminModal.isEdit && adminModal.admin.isSuperAdmin && !adminModal.canDemote">{{ i18n "pages.admins.lastSuperHint" }}</p>
    </a-form-item>



    <!-- Group grants define scope; permissions separately define operations. -->
    <a-form-item v-if="!adminModal.admin.isSuperAdmin">
      <template slot="label">
        <a-tooltip>
          <template slot="title">{{ i18n "pages.groups.adminHint" }}</template>
          {{ i18n "pages.groups.title" }}
          <a-icon type="question-circle"></a-icon>
        </a-tooltip>
      </template>
      <a-alert v-if="!adminModal.allGroups.length" type="info" show-icon
        message='{{ i18n "pages.groups.noGroups" }}'></a-alert>
      <template v-else>
        <a-checkbox :checked="adminModal.allChecked" :indeterminate="adminModal.someChecked"
          @change="adminModal.toggleAll">
          <span :style="{ fontWeight: 500 }">{{ i18n "pages.admins.selectAllInbounds" }}</span>
        </a-checkbox>
        <a-divider :style="{ margin: '8px 0' }"></a-divider>
        <div :style="{ maxHeight: '180px', overflowY: 'auto' }">
          <a-checkbox-group v-model="adminModal.admin.groupIds" :style="{ width: '100%' }">
            <a-row>
              <a-col :span="24" v-for="group in adminModal.allGroups" :key="group.id">
                <a-checkbox :value="group.id">
                  [[ group.name ]] <a-tag v-if="group.disabled">{{ i18n "disabled" }}</a-tag>
                </a-checkbox>
              </a-col>
            </a-row>
          </a-checkbox-group>
        </div>
      </template>
    </a-form-item>

    <a-form-item v-if="!adminModal.admin.isSuperAdmin" label='{{ i18n "pages.admins.roleName" }}'>
      <a-select v-model="adminModal.admin.adminRoleId" @change="adminModal.selectRole($event)" style="width:100%">
        <a-select-option :value="0">{{ i18n "pages.admins.customPermissions" }}</a-select-option>
        <a-select-option v-for="role in adminModal.allRoles" :key="role.id" :value="role.id">[[ role.name ]]</a-select-option>
      </a-select>
      <p v-if="adminModal.admin.adminRoleId">{{ i18n "pages.admins.roleInherited" }}</p>
    </a-form-item>
    <a-alert v-if="adminModal.admin.isPanelOwner" type="info" :message="'{{ i18n "pages.admins.ownerDesc" }}'" style="margin-bottom:12px"></a-alert>

    <!-- Super-admin permissions are shown checked and locked; ordinary roles inherit a live mask. -->
    <a-form-item label='{{ i18n "pages.admins.permissions" }}'>
      <a-checkbox-group v-model="adminModal.admin.permissions" :disabled="adminModal.admin.isSuperAdmin || !!adminModal.admin.adminRoleId" :style="{ width: '100%' }">
        <a-row>
          <a-col :span="24" v-for="slug in adminModal.allPermissions" :key="slug">
            <a-checkbox :value="slug">[[ adminModal.permLabel(slug) ]]</a-checkbox>
          </a-col>
        </a-row>
      </a-checkbox-group>
    </a-form-item>
  </a-form>
</a-modal>

<script>
  // Labels for the permission slugs the server publishes. Keyed by slug so the
  // server stays the source of truth for WHICH permissions exist; this only names
  // them. An unknown slug falls back to the raw slug rather than rendering blank.
  const PERMISSION_LABELS = {
    accessInbounds: '{{ i18n "pages.admins.accessInbounds" }}',
    createInbound: '{{ i18n "pages.admins.createInbound" }}',
    editInbound: '{{ i18n "pages.admins.editInbound" }}',
    deleteInbound: '{{ i18n "pages.admins.deleteInbound" }}',
    accessGroups: '{{ i18n "pages.groups.access" }}',
    createGroup: '{{ i18n "pages.groups.create" }}',
    editGroup: '{{ i18n "pages.groups.edit" }}',
    deleteGroup: '{{ i18n "pages.groups.delete" }}',
    createClient: '{{ i18n "pages.admins.createClient" }}',
    editClient: '{{ i18n "pages.admins.editClient" }}',
    deleteClient: '{{ i18n "pages.admins.deleteClient" }}',
    bulkOperation: '{{ i18n "pages.admins.bulkOperation" }}',
    accessCoreSettings: '{{ i18n "pages.admins.accessCoreSettings" }}',
    accessXraySettings: '{{ i18n "pages.admins.accessXraySettings" }}',
    accessPanelSettings: '{{ i18n "pages.admins.accessPanelSettings" }}',
    manageNodes: '{{ i18n "pages.admins.manageNodes" }}',
    manageResellers: '{{ i18n "pages.admins.manageResellers" }}',
    accessOverview: '{{ i18n "pages.admins.accessOverview" }}',
    manageOverview: '{{ i18n "pages.admins.manageOverview" }}',
  };

  const adminModal = {
    title: '',
    visible: false,
    confirmLoading: false,
    okText: '{{ i18n "sure" }}',
    isEdit: false,
    isSelf: false,
    confirm: null,
    allPermissions: [],
    allGroups: [],
    allRoles: [],
    canDemote: true,
    admin: { id: 0, username: '', password: '', nickname: '', enable: true, isSuperAdmin: false, permissions: [], groupIds: [] },

    permLabel(slug) {
      return PERMISSION_LABELS[slug] || slug;
    },
    get allChecked() {
      return adminModal.allGroups.length > 0 &&
        adminModal.admin.groupIds.length === adminModal.allGroups.length;
    },
    get someChecked() {
      const n = adminModal.admin.groupIds.length;
      return n > 0 && n < adminModal.allGroups.length;
    },
    toggleAll(e) {
      adminModal.admin.groupIds = e.target.checked
        ? adminModal.allGroups.map(ib => ib.id)
        : [];
    },
    ok() {
      ObjectUtil.execute(adminModal.confirm, adminModal.admin);
    },
    show({ allRoles = [], title = '', okText = '{{ i18n "sure" }}', admin = null, allPermissions = [], allGroups = [], confirm = () => { }, isEdit = false }) {
      this.title = title;
      this.okText = okText;
      this.confirm = confirm;
      this.isEdit = isEdit;
      this.allPermissions = allPermissions;
      this.allRoles = allRoles;
      this.allGroups = allGroups;
      if (isEdit && admin) {
        this.admin = {
          id: admin.id,
          isPanelOwner: !!admin.isPanelOwner,
          adminRoleId: admin.adminRoleId || 0,
          username: admin.username,
          password: '', // blank means "keep the current one"
          nickname: admin.nickname || '',
          enable: admin.enable,
          isSuperAdmin: admin.isSuperAdmin,
          permissions: admin.isSuperAdmin ? allPermissions.slice() : (admin.permissions || []).slice(),
          groupIds: admin.isSuperAdmin ? allGroups.map(ib=>ib.id) : (admin.groupIds || []).slice(),
        };
      } else {
        this.admin = { adminRoleId: 0, isPanelOwner:false, id: 0, username: '', password: '', nickname: '', enable: true, isSuperAdmin: false, permissions: [], groupIds: [] };
      }
      this.canDemote = !admin || admin.canDemote !== false;
      this.isSelf = isEdit && admin && admin.id === app.currentAdminId;
      this.visible = true;
    },
    selectRole(id) {
      const role = this.allRoles.find(role=>role.id===id);
      if (role) this.admin.permissions = role.permissions.slice();
    },
    superChanged(enabled) {
      if (enabled) { this.admin.adminRoleId=0;this.admin.permissions=this.allPermissions.slice(); }
    },
    // Bodies are form-urlencoded (a global axios interceptor Qs.stringify's them),
    // and Qs emits an array as repeated keys, which is what Gin binds into []string.
    // An empty array must still be sent as an explicit empty key, or removing every
    // permission would omit the field and leave the old mask in place.
    toPayload(admin) {
      return {
        username: admin.username,
        password: admin.password,
        nickname: admin.nickname,
        enable: admin.enable,
        isSuperAdmin: admin.isSuperAdmin,
        adminRoleId: admin.isSuperAdmin ? 0 : (Number(admin.adminRoleId) || 0),
        permissions: admin.isSuperAdmin ? [] : (admin.permissions.length ? admin.permissions : ['']),
        // A blank entry is how "none" is sent: an omitted key binds as nil server-side
        // and cannot be told apart from "leave the existing grants alone".
        groupIds: admin.isSuperAdmin ? [''] : (admin.groupIds.length ? admin.groupIds : ['']),
      };
    },
    close() {
      adminModal.visible = false;
      adminModal.loading(false);
    },
    loading(loading = true) {
      adminModal.confirmLoading = loading;
    },
  };

  new Vue({
    delimiters: ['[[', ']]'],
    el: '#admin-modal',
    data: { adminModal: adminModal },
  });
</script>
{{end}}
