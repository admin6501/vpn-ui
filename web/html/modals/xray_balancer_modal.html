{{define "modals/balancerModal"}}
<a-modal
    id="balancer-modal"
    v-model="balancerModal.visible"
    :title="balancerModal.title"
    @ok="balancerModal.ok"
    :confirm-loading="balancerModal.confirmLoading"
    :ok-button-props="{ props: { disabled: !balancerModal.isValid } }"
    :closable="true"
    :mask-closable="false"
    :ok-text="balancerModal.okText"
    cancel-text='{{ i18n "close" }}'
    :class="themeSwitcher.currentTheme">
    <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
        <a-form-item label='{{ i18n "pages.xray.balancer.tag" }}' has-feedback
            :validate-status="balancerModal.duplicateTag? 'warning' : 'success'">
            <a-input v-model.trim="balancerModal.balancer.tag" @change="balancerModal.check()"
                placeholder='{{ i18n "pages.xray.balancer.tagDesc" }}'></a-input>
        </a-form-item>
        <a-form-item label='{{ i18n "pages.xray.balancer.balancerStrategy" }}'>
            <a-select v-model="balancerModal.balancer.strategy" @change="balancerModal.strategyChanged" :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option value="random">{{ i18n "pages.interface.random" }}</a-select-option>
                <a-select-option value="roundRobin">{{ i18n "pages.interface.roundRobin" }}</a-select-option>
                <a-select-option value="leastLoad">{{ i18n "pages.interface.leastLoad" }}</a-select-option>
                <a-select-option value="leastPing">{{ i18n "pages.interface.leastPing" }}</a-select-option>
                <a-select-option value="failover">{{ i18n "pages.xray.balancer.failover" }}</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item v-if="balancerModal.balancer.strategy === 'failover'"
            label='{{ i18n "pages.xray.balancer.failoverPrimary" }}'
            extra='{{ i18n "pages.xray.balancer.failoverDesc" }}'>
            <a-select v-model="balancerModal.balancer.primaryTag" @change="balancerModal.primaryChanged"
                :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="tag in balancerModal.failoverTags" :key="tag" :value="tag">[[ tag ]]</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item has-feedback :validate-status="balancerModal.emptySelector? 'warning' : 'success'">
            <template slot="label">
                <span v-if="balancerModal.balancer.strategy === 'failover'">{{ i18n "pages.xray.balancer.failoverBackups" }}</span>
                <span v-else>{{ i18n "pages.xray.balancer.balancerSelectors" }}</span>
            </template>
            <a-select v-model="balancerModal.balancer.selector" :mode="balancerModal.balancer.strategy === 'failover' ? 'multiple' : 'tags'" @change="balancerModal.check()"
                :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="tag in balancerModal.selectorTags" :key="tag" :value="tag">[[ tag ]]</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item v-if="balancerModal.balancer.strategy !== 'failover'" label="{{ i18n "pages.interface.fallback" }}">
            <a-select v-model="balancerModal.balancer.fallbackTag" clearable
                :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="tag in [ '', ...balancerModal.outboundTags]" :value="tag">[[ tag ]]</a-select-option>
            </a-select>
        </a-form-item>
    </a-form>
</a-modal>
<script>
    const balancerModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        confirm: null,
        duplicateTag: false,
        emptySelector: false,
        isValid: false,
        balancer: {
            tag: '',
            strategy: 'random',
            selector: [],
            fallbackTag: '',
            primaryTag: ''
        },
        outboundTags: [],
        failoverTags: [],
        get selectorTags() {
            if (this.balancer.strategy !== 'failover') return this.outboundTags;
            return this.failoverTags.filter(tag => tag !== this.balancer.primaryTag);
        },
        balancerTags:[],
        ok() {
            balancerModal.check();
            if (!balancerModal.isValid) return;
            ObjectUtil.execute(balancerModal.confirm, balancerModal.balancer);
        },
        show({ title = '', okText = '{{ i18n "sure" }}', balancerTags = [], balancer, confirm = (balancer) => { }, isEdit = false }) {
            this.title = title;
            this.okText = okText;
            this.confirm = confirm;
            this.visible = true;
            if (isEdit) {
                balancerModal.balancer = { ...balancer, selector: [...balancer.selector] };
            } else {
                balancerModal.balancer = {
                    tag: '',
                    strategy: 'random',
                    selector: [],
                    fallbackTag: '',
                    primaryTag: ''
                };
            }
            this.balancerTags = balancerTags.filter((tag) => tag != balancer.tag);
            this.outboundTags = app.templateSettings.outbounds.filter((o) => !ObjectUtil.isEmpty(o.tag)).map(obj => obj.tag);
            this.failoverTags = app.templateSettings.outbounds
                .filter(o => o.tag && o.protocol !== 'blackhole' && o.protocol !== 'loopback')
                .map(o => o.tag);
            this.isEdit = isEdit;
            this.check();
        },
        close() {
            this.visible = false;
            this.loading(false);
        },
        loading(loading=true) {
            this.confirmLoading = loading;
        },
        check() {
            const { tag, strategy, primaryTag, selector } = this.balancer;
            this.duplicateTag = !tag || this.balancerTags.includes(tag);
            this.emptySelector = selector.length === 0;
            const validFailover = this.failoverTags.includes(primaryTag) &&
                selector.every(tag => this.selectorTags.includes(tag));
            this.isValid = !this.duplicateTag && !this.emptySelector &&
                (strategy !== 'failover' || validFailover);
        },
        strategyChanged(strategy) {
            if (strategy === 'failover') this.primaryChanged(this.balancer.primaryTag);
            else this.check();
        },
        primaryChanged(tag) {
            this.balancer.selector = this.balancer.selector.filter(
                backup => backup !== tag && this.failoverTags.includes(backup));
            this.check();
        }
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#balancer-modal',
        data: {
            balancerModal: balancerModal
        },
        methods: {
        }
    });

</script>
{{end}}
