{{define "settings/xray/balancers"}}
<template v-if="balancersData.length > 0">
    <a-space direction="vertical" size="middle">
        <a-button type="primary" icon="plus" @click="addBalancer()">
            <span>{{ i18n "pages.xray.balancer.addBalancer"}}</span>
        </a-button>
        <a-table :columns="balancerColumns" bordered :row-key="r => r.key" :data-source="balancersData"
            :scroll="isMobile ? {} : { x: 200 }" :pagination="false" :indent-size="0" :locale='{ filterConfirm: `{{ i18n "confirm" }}`, filterReset: `{{ i18n "reset" }}` }'>
            <template slot="action" slot-scope="text, balancer, index">
                <span>[[ index+1 ]]</span>
                <a-dropdown :trigger="['click']">
                    <a-icon @click="e => e.preventDefault()" type="more"
                        :style="{ fontSize: '16px', textDecoration: 'bold' }"></a-icon>
                    <a-menu slot="overlay" :theme="themeSwitcher.currentTheme">
                        <a-menu-item @click="editBalancer(index)">
                            <a-icon type="edit"></a-icon>
                            <span>{{ i18n "edit" }}</span>
                        </a-menu-item>
                        <a-menu-item @click="deleteBalancer(index)">
                            <span :style="{ color: 'var(--error)' }">
                                <a-icon type="delete"></a-icon>
                                <span>{{ i18n "delete"}}</span>
                            </span>
                        </a-menu-item>
                    </a-menu>
                </a-dropdown>
            </template>
            <template slot="strategy" slot-scope="text, balancer, index">
                <a-tag :style="{ margin: '0' }" v-if="balancer.strategy=='random'" color="purple">{{ i18n "pages.interface.random" }}</a-tag>
                <a-tag :style="{ margin: '0' }" v-if="balancer.strategy=='roundRobin'" color="green">{{ i18n "pages.interface.roundRobin" }}</a-tag>
                <a-tag :style="{ margin: '0' }" v-if="balancer.strategy=='leastLoad'" color="green">{{ i18n "pages.interface.leastLoad" }}</a-tag>
                <a-tag :style="{ margin: '0' }" v-if="balancer.strategy=='leastPing'" color="green">{{ i18n "pages.interface.leastPing" }}</a-tag>
            </template>
            <template slot="selector" slot-scope="text, balancer, index">
                <a-tag class="info-large-tag" :style="{ margin: '1' }" v-for="sel in balancer.selector">[[ sel ]]</a-tag>
            </template>
            <template slot="liveStatus" slot-scope="text, balancer">
                <a-tag v-if="nodeContext" color="default">آمار زنده در صفحه نود در دسترس نیست</a-tag>
                <template v-else>
                    <a-tag v-for="item in balancerOutboundStatuses(balancer)" :key="item.tag"
                        :color="item.active ? 'green' : 'default'" :style="{ margin: '2px' }">
                        [[ item.active ? 'دارای ترافیک · ' : 'بدون ترافیک اخیر · ' ]][[ item.tag ]]
                    </a-tag>
                    <span v-if="balancerOutboundStatuses(balancer).length === 0">خروجی مطابق Selector پیدا نشد</span>
                </template>
            </template>
        </a-table>
        <a-radio-group v-if="observatoryEnable || burstObservatoryEnable" v-model="obsSettings" @change="changeObsCode"
            button-style="solid" :size="isMobile ? 'small' : ''">
            <a-radio-button value="observatory" v-if="observatoryEnable">{{ i18n "pages.interface.observatory" }}</a-radio-button>
            <a-radio-button value="burstObservatory" v-if="burstObservatoryEnable">{{ i18n "pages.interface.burstObservatory" }}</a-radio-button>
        </a-radio-group>
        <textarea :style="{ position: 'absolute', left: '-800px' }" id="obsSetting"></textarea>
    </a-space>
</template>
<template v-else>
    <a-empty description='{{ i18n "emptyBalancersDesc" }}' :style="{ margin: '10px' }">
        <a-button type="primary" icon="plus" @click="addBalancer()" :style="{ marginTop: '10px' }">
            <span>{{ i18n "pages.xray.balancer.addBalancer"}}</span>
        </a-button>
    </a-empty>
</template>
{{end}}
