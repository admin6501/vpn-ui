{{define "form/streamHysteria"}}
<a-form
  :colon="false"
  :label-col="{ md: {span:8} }"
  :wrapper-col="{ md: {span:14} }"
>
  <a-form-item label='{{ i18n "password" }} (obfs / Salamander)'>
    <a-input-password v-model="inbound.stream.hysteriaObfsPassword" autocomplete="new-password"></a-input-password>
    <div class="bo-if-hint">{{ i18n "pages.inboundForm.hysteriaObfsHint" }}</div>
  </a-form-item>
  <a-form-item label='{{ i18n "pages.inboundForm.udpIdleTimeout" }}'>
    <a-input-number
      v-model.number="inbound.stream.hysteria.udpIdleTimeout"
      :min="0"
    ></a-input-number>
  </a-form-item>
  <a-form-item label='{{ i18n "pages.inboundForm.masquerade" }}'>
    <a-switch v-model="inbound.stream.hysteria.masqueradeSwitch"></a-switch>
  </a-form-item>
  <template v-if="inbound.stream.hysteria.masqueradeSwitch">
    <div class="bo-if-sub">{{ i18n "pages.inboundForm.masquerade" }}</div>
    <a-form-item label='{{ i18n "pages.inboundForm.type" }}'>
      <a-select
        v-model="inbound.stream.hysteria.masquerade.type"
        :dropdown-class-name="themeSwitcher.currentTheme"
      >
        <a-select-option value="file">{{ i18n "pages.inboundForm.staticFiles" }}</a-select-option>
        <a-select-option value="proxy">{{ i18n "pages.inboundForm.reverseProxy" }}</a-select-option>
        <a-select-option value="string">{{ i18n "pages.inboundForm.fixedString" }}</a-select-option>
      </a-select>
    </a-form-item>
    <a-form-item
      label='{{ i18n "pages.inboundForm.directory" }}'
      v-if="inbound.stream.hysteria.masquerade.type === 'file'"
    >
      <a-input v-model.trim="inbound.stream.hysteria.masquerade.dir"></a-input>
    </a-form-item>
    <template v-if="inbound.stream.hysteria.masquerade.type === 'proxy'">
      <a-form-item label='{{ i18n "pages.inboundForm.upstreamUrl" }}'>
        <a-input
          v-model.trim="inbound.stream.hysteria.masquerade.url"
        ></a-input>
      </a-form-item>
      <a-form-item label='{{ i18n "pages.inboundForm.rewriteHost" }}'>
        <a-switch
          v-model="inbound.stream.hysteria.masquerade.rewriteHost"
        ></a-switch>
      </a-form-item>
      <a-form-item label='{{ i18n "pages.inboundForm.insecure" }}'>
        <a-switch
          v-model="inbound.stream.hysteria.masquerade.insecure"
        ></a-switch>
      </a-form-item>
    </template>
    <template v-if="inbound.stream.hysteria.masquerade.type === 'string'">
      <a-form-item label='{{ i18n "pages.inboundForm.responseBody" }}'>
        <a-input
          v-model.trim="inbound.stream.hysteria.masquerade.content"
        ></a-input>
      </a-form-item>
      <a-form-item label='{{ i18n "pages.inbounds.stream.tcp.requestHeader" }}'>
        <a-button
          size="small"
          @click="inbound.stream.hysteria.masquerade.addHeader('', '')"
          >+</a-button
        >
      </a-form-item>
      <a-form-item :wrapper-col="{span:24}">
        <a-input-group
          compact
          v-for="(header, index) in inbound.stream.hysteria.masquerade.headers"
        >
          <a-input
            style="width: 50%"
            v-model.trim="header.name"
            placeholder='{{ i18n "pages.inbounds.stream.general.name"}}'
          >
            <template slot="addonBefore" style="margin: 0"
              >[[ index+1 ]]</template
            >
          </a-input>
          <a-input
            style="width: 50%"
            v-model.trim="header.value"
            placeholder='{{ i18n "pages.inbounds.stream.general.value" }}'
          >
            <a-button
              slot="addonAfter"
              size="small"
              @click="inbound.stream.hysteria.masquerade.removeHeader(index)"
              >-</a-button
            >
          </a-input>
        </a-input-group>
      </a-form-item>
      <a-form-item label='{{ i18n "pages.inboundForm.statusCode" }}'>
        <a-input-number
          v-model.number="inbound.stream.hysteria.masquerade.statusCode"
        ></a-input-number>
      </a-form-item>
    </template>
  </template>
</a-form>
{{end}}
