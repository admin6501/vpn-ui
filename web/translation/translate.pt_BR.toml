alsoAcceptGreWrappedInUdpFou = "Também aceita GRE encapsulado em UDP (FOU), para pares atrás de um NAT que não pode passar o protocolo 47. SOMENTE LINUX E OPENWRT: MikroTik, Cisco e Keenetic não implementam FOU, e é por isso que ele é separado do switch IPsec em vez de empacotado com ele. Os pares que não o utilizam não são afetados. Requer que o IP público do peer seja preenchido na conta: um peer deixado em branco (dinâmico) é sempre servido por GRE simples, porque o tráfego encapsulado em UDP não carrega nada do qual o servidor possa aprender uma mudança de endereço."
