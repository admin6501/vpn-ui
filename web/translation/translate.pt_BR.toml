udpPortTheFouListenerBindsMust = "Porta UDP que o listener FOU liga. Deve corresponder ao encap-dport no peer."
fouPort = "Porta FOU"
leaveAt0ToLetTheKernel = "Deixe em 0 para deixar o kernel escolher, o que quase sempre está certo: o valor correto difere por modo (1476 para GRE simples, menos em FOU ou IPsec) e o kernel já sabe qual deles se aplica. O GRE não negocia MTU, portanto, configure-o também no roteador se você substituí-lo."
0KernelDefault = "0 = padrão do kernel"
outerTtlOfTheEncapsulatedPackets = "TTL externo dos pacotes encapsulados."
wrapTheTunnelInIpsecEspTransport = "Enrole o túnel em IPsec (modo de transporte ESP) no daemon strongSwan compartilhado do painel. No roteador, este é um par IPsec mais uma política para o protocolo GRE com túnel=não."
ipsecPsk = "IPsec PSK"
keepAcceptingTunnelsThatArriveWithoutIpsec = "Continue aceitando túneis que chegam SEM IPsec. Desligue isso para exigir criptografia: os pacotes do protocolo 47 simples são descartados, portanto, qualquer roteador ainda configurado para GRE simples para de funcionar. Deixe-o ativado durante a migração dos clientes existentes."
allowUnencrypted = "Permitir não criptografado"
peerRouters = "roteadores de mesmo nível"
autoManagedContiguousBlock105X = "Bloco contíguo gerenciado automaticamente (10.5.x). Cresce automaticamente à medida que os clientes são adicionados."
quicCongestionControllerForThisListenerBbr = "Controlador de congestionamento QUIC para este listener. O BBR geralmente vence em um caminho com perdas ou de longo curso porque ele controla a largura de banda medida em vez de recuar em cada pacote perdido, que é o que faz com que valha a pena usar TUIC em primeiro lugar. Cúbico é o padrão seguro e bem compreendido e corresponde ao que os fluxos TCP da rede fazem. O novo Reno é mais antigo e mais suave, útil principalmente quando o BBR exclui outro tráfego em um link pequeno."
congestionControl = "Controle de congestionamento"
howLongAFreshlyOpenedConnectionMay = "Por quanto tempo uma conexão recém-aberta pode permanecer não autenticada antes que o servidor a descarte. Curto é bom: é o que impede um peer não autenticado de manter o estado QUIC aberto. Aumente-o apenas se os clientes em um caminho muito lento estiverem sendo desconectados antes de concluírem a autenticação."
authTimeout = "Tempo limite de autenticação"
seconds = "segundos"
udpTimeout = "Tempo limite de UDP"
intervalBetweenKeepalivePacketsOnAnIdle = "Intervalo entre pacotes de manutenção de atividade em uma conexão inativa. São eles que mantêm um mapeamento de NAT ou firewall ativo para que um túnel ocioso não fique inoperante silenciosamente. Lower é mais robusto atrás de NAT agressivo e custa um pouco mais de bateria e tráfego."
