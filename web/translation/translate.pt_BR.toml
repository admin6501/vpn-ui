"modeClassic" = "Modo classico"
"modeClassicDesc" = "O transporte ofuscado original (sem prefixo no segredo). Muito compativel, mas o mais facil de identificar pelo DPI. Desligado significa que o proxy recusa o segredo simples."
"modeSecure" = "Modo seguro (dd)"
"modeSecureDesc" = "Modo de preenchimento aleatorio (prefixo dd no segredo). Esconde do DPI os padroes de tamanho dos pacotes."
"modeTls" = "Modo FakeTLS (ee)"
"modeTlsDesc" = "FakeTLS (prefixo ee no segredo): o trafego parece uma sessao HTTPS comum para o dominio abaixo. E o modo mais resistente a censura."
"tlsDomain" = "Dominio FakeTLS"
"tlsDomainDesc" = "O dominio que os links FakeTLS imitam, codificado em cada segredo ee desta entrada. Escolha um site HTTPS real e acessivel, plausivel e que nao esteja bloqueado. Alterar isso invalida os links ee ja distribuidos."
"userLimit" = "Limite de usuario"
"userLimitDesc" = "Maximo de IPs de cliente simultaneos por conta, aplicado pelo proprio proxy (a conexao excedente e recusada). O padrao e 10; 0 nao significa sem limite, permite 16. Dispositivos que compartilham um IP atras de NAT contam como um."
"adtag" = "Tag de anuncio"
"adtagDesc" = "Divulgue um canal patrocinado com uma tag do @MTProxybot. Leia o aviso antes de ativar: ela desliga o roteamento do Xray para todas as contas desta entrada."
"adtagPlaceholder" = "32 caracteres hexadecimais do @MTProxybot"
"adtagClientWarn" = "Definir uma etiqueta para ESTA unica conta coloca TODA a entrada nos reles intermediarios do Telegram. As outras contas dessa entrada tambem saem diretamente deste servidor e suas regras de roteamento do Xray deixam de valer para qualquer uma delas. Remova a etiqueta de todas as contas daqui para recuperar o roteamento."
"adtagRoutingOffTitle" = "A tag de anuncio desliga o roteamento do Xray nesta entrada"
"adtagRoutingOffDesc" = "Uma tag de anuncio so conta se o trafego passar pelos reles intermediarios do Telegram, e esse caminho e uma propriedade do processo do proxy. Enquanto ela estiver definida, todas as contas desta entrada saem diretamente deste servidor e suas regras de roteamento de saida nao se aplicam a nenhuma delas. O Telegram deriva a chave de sessao do proxy intermediario do IP e da porta de saida deste servidor, portanto enviar esse trafego pelo Xray mudaria a porta e quebraria o handshake. Limpe a tag de anuncio para rotear esta entrada pelo Xray."

