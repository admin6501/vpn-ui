dpiObfuscationParametersTheseMustMatchOn = "Parameter kebingungan DPI. Ini harus cocok di klien, yang konfigurasi dan QR-nya dibuat secara otomatis, sehingga Anda jarang perlu menyentuhnya. Header ajaib (H1-H4) dicetak oleh server."
