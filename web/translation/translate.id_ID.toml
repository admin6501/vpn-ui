fouPort = "Pelabuhan FOU"
leaveAt0ToLetTheKernel = "Biarkan di 0 agar kernel memilih, yang hampir selalu benar: nilai yang benar berbeda untuk setiap mode (1476 untuk GRE biasa, lebih sedikit untuk FOU atau IPsec) dan kernel sudah mengetahui mana yang berlaku. GRE tidak menegosiasikan MTU, jadi atur juga di router jika Anda menimpanya."
0KernelDefault = "0 = default kernel"
outerTtlOfTheEncapsulatedPackets = "TTL luar dari paket yang dienkapsulasi."
wrapTheTunnelInIpsecEspTransport = "Bungkus terowongan dalam IPsec (mode transportasi ESP) pada daemon strongSwan bersama panel. Di router ini adalah rekan IPsec ditambah kebijakan untuk protokol GRE dengan terowongan=no."
ipsecPsk = "IPsec PSK"
keepAcceptingTunnelsThatArriveWithoutIpsec = "Tetap menerima terowongan yang datang TANPA IPsec. Matikan ini untuk memerlukan enkripsi: paket protokol-47 yang kosong kemudian dibuang, sehingga router apa pun yang masih dikonfigurasi untuk GRE biasa berhenti bekerja. Biarkan aktif saat memigrasikan pelanggan yang sudah ada."
allowUnencrypted = "Izinkan Tidak Terenkripsi"
peerRouters = "router rekan"
autoManagedContiguousBlock105X = "Blok bersebelahan yang dikelola otomatis (10.5.x). Tumbuh secara otomatis seiring bertambahnya klien."
quicCongestionControllerForThisListenerBbr = "Pengontrol kemacetan QUIC untuk pendengar ini. BBR biasanya menang pada jalur lossy atau jarak jauh karena BBR mengukur bandwidth dibandingkan mundur pada setiap paket yang hilang, itulah yang menjadikan TUIC layak untuk digunakan. Kubik adalah default yang aman dan dipahami dengan baik serta cocok dengan aliran jaringan TCP. New Reno lebih tua dan lebih lembut, berguna terutama ketika BBR memadati lalu lintas lain di jalur kecil."
congestionControl = "Pengendalian Kemacetan"
howLongAFreshlyOpenedConnectionMay = "Berapa lama koneksi yang baru dibuka mungkin tetap tidak diautentikasi sebelum server memutuskannya. Pendek itu bagus: inilah yang menghentikan rekan yang tidak diautentikasi untuk membiarkan status QUIC tetap terbuka. Naikkan hanya jika klien pada jalur yang sangat lambat terputus sebelum mereka selesai mengautentikasi."
