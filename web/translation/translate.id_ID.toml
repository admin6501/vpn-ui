fixedString = "String Tetap"
aDirectoryOnThisServerServedAs = "Direktori di server ini, berfungsi sebagai situs statis. Dibutuhkan index.html atau jalur root mengembalikan daftar direktori, yang tidak dapat dilakukan oleh situs web sebenarnya. Segala sesuatu di direktori dapat dibaca oleh publik, jadi jangan arahkan ke apa pun yang tidak ingin Anda publikasikan."
directory = "Direktori"
theSiteToRelayPickOneThat = "Situs yang akan di-relay. Pilih salah satu yang masuk akal untuk nama host server ini, dimuat dengan cepat dan tidak diblokir di tempat pengguna Anda berada: setiap permintaan yang tidak diautentikasi, termasuk permintaan sensor, diambil secara langsung dari server tersebut. Permintaan dibuat dari server ini, jadi alamatnya adalah apa yang dilihat oleh situs upstream."
upstreamUrl = "URL hulu"
returnedVerbatimForEveryPathSoThe = "Mengembalikan kata demi kata untuk setiap jalur, jadi keseluruhan situs adalah satu halaman. Baik sebagai pengganti cepat, lemah sebagai kamuflase: host yang menjawab setiap URL dengan byte yang sama mudah dikenali."
responseBody = "Badan Respons"
alsoAcceptGreWrappedInUdpFou = "Juga menerima GRE yang dibungkus dengan UDP (FOU), untuk rekan di belakang NAT yang tidak dapat melewati protokol 47. HANYA LINUX DAN OPENWRT: MikroTik, Cisco dan Keenetic tidak mengimplementasikan FOU, itulah sebabnya ini terpisah dari switch IPsec dan bukan dibundel dengannya. Rekan-rekan yang tidak menggunakannya tidak terpengaruh. Mengharuskan IP publik rekan diisi pada akun: rekan yang dikosongkan (dinamis) selalu disajikan melalui GRE biasa, karena lalu lintas yang dibungkus UDP tidak membawa apa pun sehingga server dapat mempelajari perubahan alamat."
udpEncapsulation = "enkapsulasi UDP"
