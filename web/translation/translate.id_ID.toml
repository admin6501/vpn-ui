rand = "Rand"
reset = "Setel ulang"
camouflageForTheTlsRecordSizesOf = "Kamuflase untuk ukuran rekaman TLS dari beberapa rekaman pertama suatu sesi, yang merupakan bagian yang dapat diukur oleh sensor tanpa mendekripsi apa pun. Setiap baris merupakan satu aturan: \"stop=N\" mengakhiri padding setelah record ke-N, dan \"N=min-max\" memberikan rentang ukuran record yang diisi N (koma membagi satu record menjadi beberapa). Skema server adalah skema yang otoritatif, sehingga klien yang terhubung dengan skema berbeda diberikan skema ini selama jabat tangan. Biarkan kosong kecuali Anda punya alasan: default bawaannya adalah skema yang digunakan orang lain, dan skema unik itu sendiri adalah sidik jari."
