whichHttpVersionTheListenerSpeaksTcp = "Versi HTTP mana yang diucapkan pendengar. TCP melayani HTTP/2 melalui TLS, yang digunakan oleh klien naif secara default dan menyatu di mana saja. UDP melayani HTTP/3 melalui QUIC: lebih cepat pada jalur lossy, namun beberapa jaringan langsung membatasi atau memblokir UDP/443. Melayani keduanya memungkinkan klien memilih dan mundur sendiri."
tcpUdpBoth = "TCP,UDP (keduanya)"
masquerade = "Penyamaran"
whatUnauthenticatedVisitorsGet404ReturnsA = "Apa yang didapat pengunjung yang tidak diautentikasi. 404 mengembalikan Not Found biasa. File Statis menyajikan direktori dari disk server ini. Reverse Proxy mengambil situs asli dan meneruskannya, yang merupakan opsi paling meyakinkan dan pilihan untuk dipilih jika Anda memiliki situs untuk ditunjuk. Memperbaiki String mengembalikan satu isi kaleng untuk setiap jalur."
type = "Jenis"
