"tlsDomainDesc" = "Домен, под который маскируются ссылки FakeTLS; он закодирован в каждом секрете ee этого входящего. Выберите реальный доступный сайт HTTPS, правдоподобный и сам по себе не заблокированный. Смена домена делает недействительными уже выданные ссылки ee."
"userLimit" = "Лимит пользователя"
"userLimitDesc" = "Максимум одновременных IP клиента на аккаунт, его применяет сам прокси (лишнее подключение отклоняется). Значение по умолчанию 10; 0 не означает без ограничений, а разрешает 16. Устройства за одним NAT с общим IP считаются как одно."
"adtag" = "Рекламная метка"
"adtagDesc" = "Продвигайте спонсорский канал с меткой от @MTProxybot. Прочитайте предупреждение перед включением: она отключает маршрутизацию Xray для всех аккаунтов этого входящего."
"adtagPlaceholder" = "32 шестнадцатеричных символа от @MTProxybot"
"adtagClientWarn" = "Метка, заданная для ОДНОГО этого аккаунта, переводит ВЕСЬ входящий на промежуточные релеи Telegram. Все остальные аккаунты на нем тоже выходят напрямую с этого сервера, и ваши правила маршрутизации Xray перестают применяться к любому из них. Снимите метки со всех аккаунтов здесь, чтобы вернуть маршрутизацию."
"adtagRoutingOffTitle" = "Рекламная метка отключает маршрутизацию Xray для этого входящего"
"adtagRoutingOffDesc" = "Рекламная метка учитывается, только если трафик идет через промежуточные релеи Telegram, а этот путь является свойством самого процесса прокси. Пока метка задана, все аккаунты этого входящего выходят напрямую с этого сервера, и ваши правила исходящей маршрутизации не применяются ни к одному из них. Telegram выводит ключ сессии промежуточного прокси из исходящего IP и порта этого сервера, поэтому отправка такого трафика через Xray сменит порт и сломает рукопожатие. Очистите рекламную метку, чтобы маршрутизировать этот входящий через Xray."

