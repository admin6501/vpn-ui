"adtagRoutingOffTitle" = "Reklam Etiketi bu gelen baglanti icin Xray yonlendirmesini kapatir"
"adtagRoutingOffDesc" = "Bir reklam etiketi yalnizca trafik Telegram ara proxy roleleri uzerinden gecerse sayilir ve bu yol proxy surecinin kendi ozelligidir. Etiket tanimliyken bu gelen baglantidaki tum hesaplar dogrudan bu sunucudan cikis yapar ve giden yonlendirme kurallariniz hicbirine uygulanmaz. Telegram, ara proxy oturum anahtarini bu sunucunun giden IP ve port bilgisinden turetir; bu nedenle o trafigi Xray uzerinden gondermek portu degistirir ve el sikismayi bozar. Bu gelen baglantiyi Xray uzerinden yonlendirmek icin Reklam Etiketini temizleyin."

