"tlsDomainDesc" = "FakeTLS baglantilarinin taklit ettigi alan adi; bu gelen baglantidaki her ee gizli anahtarinin icine kodlanir. Gercek, erisilebilir, inandirici ve kendisi engellenmemis bir HTTPS sitesi secin. Degistirmek, dagitilmis ee baglantilarini gecersiz kilar."
