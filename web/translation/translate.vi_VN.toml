alsoAcceptGreWrappedInUdpFou = "Đồng thời chấp nhận GRE được gói trong UDP (FOU), dành cho các thiết bị ngang hàng phía sau NAT không thể vượt qua giao thức 47. CHỈ LINUX VÀ OPENWRT: MikroTik, Cisco và Keenetic không triển khai FOU, đó là lý do tại sao điều này tách biệt với bộ chuyển mạch IPsec thay vì đi kèm với nó. Những người ngang hàng không sử dụng nó sẽ không bị ảnh hưởng. Yêu cầu điền IP công khai của thiết bị ngang hàng vào tài khoản: một thiết bị ngang hàng để trống (động) luôn được cung cấp trên GRE đơn giản, vì lưu lượng được bao bọc UDP không mang theo thông tin gì mà máy chủ có thể tìm hiểu địa chỉ thay đổi từ đó."
udpEncapsulation = "đóng gói UDP"
