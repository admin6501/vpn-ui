quicCongestionControllerForThisListenerBbr = "Bộ điều khiển tắc nghẽn QUIC cho trình nghe này. BBR thường chiến thắng trên đường dẫn bị mất hoặc đường dài vì nó đi theo băng thông đo được thay vì lùi lại trên mỗi gói bị mất, đây là điều khiến TUIC đáng được sử dụng ngay từ đầu. Cubic là mặc định an toàn, được hiểu rõ và phù hợp với những gì luồng TCP của mạng thực hiện. Reno mới cũ hơn và nhẹ nhàng hơn, chủ yếu hữu ích khi BBR lấn át lưu lượng truy cập khác trên một liên kết nhỏ."
