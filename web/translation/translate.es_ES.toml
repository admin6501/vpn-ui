returnedVerbatimForEveryPathSoThe = "Devuelto palabra por palabra para cada ruta, por lo que todo el sitio es una página. Bien como marcador de posición rápido, débil como camuflaje: un host que responde a cada URL con bytes idénticos es fácil de detectar."
responseBody = "Cuerpo de respuesta"
alsoAcceptGreWrappedInUdpFou = "también acepte GRE incluido en UDP (FOU), para pares detrás de un NAT que no puede pasar el protocolo 47. SÓLO LINUX Y OPENWRT: MikroTik, Cisco y Keenetic no implementan FOU, por lo que está separado del conmutador IPsec en lugar de estar incluido con él. Los compañeros que no lo utilizan no se ven afectados. Requiere que se complete la IP pública del par en la cuenta: un par que se deja en blanco (dinámico) siempre se sirve a través de GRE simple, porque el tráfico empaquetado en UDP no lleva nada del que el servidor pueda aprender una dirección cambiante."
udpEncapsulation = "Encapsulación UDP"
udpPortTheFouListenerBindsMust = "puerto UDP al que se vincula el escucha FOU. Debe coincidir con encap-dport en el par."
fouPort = "Puerto FOU"
leaveAt0ToLetTheKernel = "déjelo en 0 para permitir que el kernel elija, lo cual casi siempre es correcto: el valor correcto difiere según el modo (1476 para GRE simple, menos bajo FOU o IPsec) y el kernel ya sabe cuál se aplica. GRE no negocia MTU, así que configúrelo también en el enrutador si lo anula."
0KernelDefault = "0 = valor predeterminado del kernel"
outerTtlOfTheEncapsulatedPackets = "TTL externo de los paquetes encapsulados."
wrapTheTunnelInIpsecEspTransport = "Envuelva el túnel en IPsec (modo de transporte ESP) en el demonio strongSwan compartido del panel. En el enrutador, este es un par IPsec más una política para el protocolo GRE con túnel=no."
ipsecPsk = "IPsec PSK"
keepAcceptingTunnelsThatArriveWithoutIpsec = "Seguir aceptando túneles que llegan SIN IPsec. Desactive esto para requerir cifrado: los paquetes del protocolo básico 47 se descartan, por lo que cualquier enrutador que aún esté configurado para GRE simple deja de funcionar. Déjelo activado mientras migra los clientes existentes."
allowUnencrypted = "Permitir sin cifrar"
peerRouters = "enrutadores pares"
autoManagedContiguousBlock105X = "Bloque contiguo administrado automáticamente (10.5.x). Crece automáticamente a medida que se agregan clientes."
quicCongestionControllerForThisListenerBbr = "Controlador de congestión QUIC para este oyente. BBR generalmente gana en una ruta con pérdidas o de larga distancia porque acelera el ancho de banda medido en lugar de retroceder en cada paquete perdido, que es lo que hace que valga la pena usar TUIC en primer lugar. Cubic es el valor predeterminado seguro y bien comprendido y coincide con lo que hacen los flujos TCP de la red. New Reno es más antiguo y más suave, útil principalmente cuando BBR desplaza el resto del tráfico en un enlace pequeño."
congestionControl = "Control de congestión"
howLongAFreshlyOpenedConnectionMay = "cuánto tiempo puede permanecer sin autenticar una conexión recién abierta antes de que el servidor la abandone. Lo corto es bueno: es lo que impide que un par no autenticado mantenga abierto el estado QUIC. Auméntelo solo si los clientes en una ruta muy lenta se desconectan antes de que terminen de autenticarse."
authTimeout = "Tiempo de espera de autenticación"
seconds = "segundos"
udpTimeout = "UDP Tiempo de espera"
intervalBetweenKeepalivePacketsOnAnIdle = "Intervalo entre paquetes keepalive en una conexión inactiva. Estos son los que mantienen vivo un NAT o un mapeo de firewall para que un túnel inactivo no se apague silenciosamente. El más bajo es más robusto detrás de una NAT agresiva y cuesta un poco más de batería y tráfico."
heartbeat = "Latido del corazón"
0RttHandshake = "Apretón de manos 0-RTT"
newInbound = "Nuevo entrante"
