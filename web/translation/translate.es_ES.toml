ikePortHint = "puerto IKE (UDP), estándar 500. Los clientes personalizados pueden utilizar un puerto diferente; cada entrante podrá utilizar el suyo propio."
sstpPortHint = "SSTP túneles PPP sobre TLS; el cliente se conecta a través de TLS en este puerto TCP. La mayoría de los clientes utilizan el puerto 443 (el puerto HTTPS)."
