theSiteToRelayPickOneThat = "El sitio a retransmitir. Elija uno que sea plausible para el nombre de host de este servidor, que se cargue rápidamente y que no esté bloqueado donde están sus usuarios: cada solicitud no autenticada, incluida la de un censor, se obtiene en vivo de él. Las solicitudes se realizan desde este servidor, por lo que su dirección es la que ve el sitio ascendente."
